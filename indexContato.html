<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/mainContact.css">
    <title>Contato | Meu Ecommerce</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-section">
            <h1>Contato</h1>
            <p>Fale Conosco</p>
            <form id="contact-form">
                <label for="name">Nome: </label>
                <input type="text" id="name" required>
                <label for="email">E-mail: </label>
                <input type="email" name="email" id="email" required>
                <label for="message">Mensagem:</label>
                <textarea name="message" id="message" required></textarea>
                <button type="submit">Enviar</button>
            </form>
            <div class="contact-info">
                <h2>Informações de contato</h2>
                <p>Endereço: Rua das Lojas, Nº 123 - São Paulo *- SP</p>
                <p>Telefone: (11) 1234-5678</p>
                <p>Email: contato@ecommerce.com.br</p>
                <p>Horário de Atendimento: Segunda a Sexta 09h as 18h</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 - EBAC Ecommerce v1</p>
    </footer>
    <script src="/scriptContact.js"></script>
</body>
</html>
