<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/main.css" type="text/css">
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <title>Home | Meu Ecommerce</title>
</head>
<body>
    <header>
        <div class="menu" id="menu">
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="/indexSobre.html">Sobre</a></li>
                    <li><a href="/indexContato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="content" id="content">
            <div class="toggle-button" id="toggle-button">Menu</div>
            <section class="hero">
                <h1>Seja bem-vindo ao nosso ecommerce com JavaScript</h1>
                <p>Encontre aqui o seu produto</p>
                <button>Compra Agora</button>
            </section>
        </div>
        <section class="products">
            <h2>Produtos em Destaque</h2>
            <div class="product-grid">
                <!--Aqui serão inseridos o produtos pelo javascript-->
            </div>
        </section>
        <section class="cart">
            <h2>Carrinho de compra</h2>
            <table>
                <thead>
                    <tr>
                        <th>Produtos</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <!--Aqui serão inseridos os itens do carrinho pelo JS-->
                </tbody>
            </table>
            <p>Total: <span id="total">R$ 0.00</span></p>
            <button id="checkout">Pagar</button>
        </section>
    </main>
</body>
    <footer>
        <p>&copy; 2025 - EBAC Ecommerce - Carlos Eduardo Alderighi</p>
    </footer>
    <script src="/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slideout/1.0.1/slideout.min.js"></script>
</html>
